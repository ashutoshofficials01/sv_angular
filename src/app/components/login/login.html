<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-white to-green-50 dark:from-slate-900 dark:via-slate-900 dark:to-slate-800 transition-colors duration-300"
>
  <div
    class="w-full max-w-6xl mx-6 bg-white/80 dark:bg-slate-800 backdrop-blur-md rounded-3xl shadow-2xl border border-blue-100 dark:border-slate-700 grid grid-cols-1 md:grid-cols-2 overflow-hidden"
  >
    <div class="p-10 flex flex-col justify-center">
      <div class="mb-8">
        <h2 class="text-2xl font-bold text-blue-700 dark:text-blue-400">ScanVera</h2>
      </div>
      <h1 class="text-3xl font-semibold text-slate-800 dark:text-white mb-8">Login</h1>
      <!-- <div class="mb-6">
        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">
          Email Address <span class="text-red-500">*</span>
        </label>
        <input
          type="email"
          [(ngModel)]="logEmailId"
          placeholder="Enter your email"
          class="w-full px-4 py-3 rounded-xl border border-blue-200 dark:border-slate-600 bg-blue-50 dark:bg-slate-900 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all duration-300"
        />
      </div> -->

      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">
          Email Address <span class="text-red-500">*</span>
        </label>

        <input
          type="email"
          [(ngModel)]="logEmailId"
          (blur)="validateEmail()"
          placeholder="Enter your email"
          class="w-full px-4 py-3 rounded-xl border bg-blue-50 dark:bg-slate-900 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 transition-all duration-300"
          [ngClass]="{
            'border-red-500 focus:ring-red-400': emailError,
            'border-blue-200 dark:border-slate-600 focus:ring-green-500': !emailError,
          }"
        />

        <p *ngIf="emailError" class="text-sm text-red-500 mt-2">
          Please enter a valid email address.
        </p>
      </div>

      <!-- <div class="mb-8">
        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">
          Password <span class="text-red-500">*</span>
        </label>
        <input
          type="password"
          [(ngModel)]="logPassword"
          placeholder="Enter your password"
          class="w-full px-4 py-3 rounded-xl border border-blue-200 dark:border-slate-600 bg-blue-50 dark:bg-slate-900 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all duration-300"
        />
      </div> -->

      <div class="mb-8 relative">
        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-2">
          Password <span class="text-red-500">*</span>
        </label>

        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="logPassword"
          placeholder="Enter your password"
          class="w-full px-4 py-3 rounded-xl border border-blue-200 dark:border-slate-600 bg-blue-50 dark:bg-slate-900 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-green-500 transition-all duration-300"
        />

        <!-- Show / Hide Toggle -->
        <button
          type="button"
          (click)="togglePassword()"
          class="absolute right-4 top-11 text-sm text-blue-600 dark:text-green-400 hover:underline"
        >
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>

      <!-- <button
        type="button"
        (click)="checkLogin(logEmailId, logPassword, 'personal')"
        class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-green-500 hover:from-blue-700 hover:to-green-600 text-white font-semibold shadow-md hover:shadow-lg border border-blue-600 dark:border-green-400 transition-all duration-300"
      >
        Login
      </button> -->
      <button
        (click)="handleLogin()"
        class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 to-green-500 hover:from-blue-700 hover:to-green-600 text-white font-semibold shadow-md hover:shadow-lg border border-blue-600 dark:border-green-400 transition-all duration-300"
      >
        Login
      </button>
      <div class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
        Don’t have an account?
        <button
          (click)="registerPageNav('personal')"
          class="text-blue-600 dark:text-green-400 font-medium hover:underline ml-1"
        >
          Register
        </button>
      </div>
    </div>

    <div
      class="hidden md:flex items-center justify-center bg-gradient-to-br from-blue-100 to-green-100 dark:from-slate-900 dark:to-slate-800 p-10"
    >
      <div class="text-center">
        <div
          class="w-48 h-48 mx-auto mb-6 rounded-full bg-gradient-to-r from-blue-500 to-green-400 flex items-center justify-center shadow-lg"
        >
          <svg viewBox="0 0 200 200" class="w-24 h-24 text-white">
            <rect x="60" y="40" width="80" height="120" rx="12" fill="white" opacity="0.2" />
            <line
              x1="80"
              y1="80"
              x2="120"
              y2="80"
              stroke="white"
              stroke-width="6"
              stroke-linecap="round"
            />
            <line
              x1="80"
              y1="110"
              x2="120"
              y2="110"
              stroke="white"
              stroke-width="6"
              stroke-linecap="round"
            />
          </svg>
        </div>

        <h3 class="text-xl font-semibold text-blue-700 dark:text-blue-400">
          Smart Resume Screening
        </h3>

        <p class="text-sm text-slate-600 dark:text-slate-400 mt-2 max-w-xs mx-auto">
          Optimize and validate your resume for modern ATS systems.
        </p>
      </div>
    </div>
  </div>
</div>
